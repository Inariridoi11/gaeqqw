<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>🍄 Plataformas</title><link rel="stylesheet" href="../assets/arcade.css"></head>
<body><header class="bar"><button class="back" onclick="location.href='../index.html'">&larr; Arcade</button><h1>🍄 Plataformas</h1></header><main>
<div class="hud"><span>Monedas <b id="co">0</b></span><span>Vidas <b id="v">3</b></span><span>Nivel <b id="n">1</b></span><span id="st"></span></div>
<canvas id="c" width="720" height="420"></canvas>
<div class="row"><button class="btn" onclick="init()">Reiniciar</button></div>
<p class="help">← → moverse, ESPACIO/↑ saltar (puedes rebotar sobre enemigos). Llega a la bandera 🚩.</p></main>
<script src="../assets/arcade.js"></script><script>
const c=document.getElementById('c'),X=c.getContext('2d');
let p,plats,coins,foes,cam,coin,lives,lvl,k={},goal,dead;
function init(){coin=0;lives=3;lvl=1;build();}
function build(){
 plats=[{x:0,y:380,w:600,h:40},{x:660,y:380,w:900,h:40},{x:1620,y:380,w:1200,h:40}];
 for(let i=0;i<16+lvl*3;i++)plats.push({x:300+i*160+Math.random()*60,y:180+Math.random()*150,w:90+Math.random()*80,h:18});
 coins=[];for(let i=0;i<24;i++)coins.push({x:280+i*110,y:120+Math.random()*220,got:0});
 foes=[];for(let i=0;i<6+lvl*2;i++)foes.push({x:420+i*260,y:352,w:26,h:26,dir:1,alive:1,x0:420+i*260});
 goal={x:2600,y:300};
 p={x:60,y:300,vx:0,vy:0,grd:0};cam=0;dead=0;
 document.getElementById('n').textContent=lvl;document.getElementById('st').textContent='';}
addEventListener('keydown',e=>{k[e.key]=k[e.code]=1;
 if(e.code==='Space'||e.key==='ArrowUp'){jump();e.preventDefault();}
 if(dead&&e.code==='Space')init();});
addEventListener('keyup',e=>k[e.key]=k[e.code]=0);
function jump(){ if(p.grd){p.vy=-490;p.grd=0;Arcade.beep(700,.06);} }
c.ontouchstart=e=>{const r=c.getBoundingClientRect();const tx=(e.touches[0].clientX-r.left)*(720/r.width);
 if(tx<240)k.ArrowLeft=1;else if(tx>480)k.ArrowRight=1;else jump();e.preventDefault();};
c.ontouchend=()=>{k.ArrowLeft=k.ArrowRight=0;};
Arcade.loop(dt=>{
 if(!dead){
  if(k.ArrowLeft)p.vx=-230; else if(k.ArrowRight)p.vx=230; else p.vx*=.75;
  p.vy+=1250*dt;
  p.x+=p.vx*dt; p.y+=p.vy*dt; p.grd=0;
  if(p.x<0)p.x=0;
  for(const pl of plats){
   if(p.x+22>pl.x&&p.x<pl.x+pl.w&&p.y+34>pl.y&&p.y+34<pl.y+pl.h+22&&p.vy>=0){
    p.y=pl.y-34;p.vy=0;p.grd=1;} }
  for(const f of foes){ if(!f.alive)continue;
   f.x+=f.dir*58*dt; if(Math.abs(f.x-f.x0)>90)f.dir*=-1;
   if(p.x+20>f.x&&p.x<f.x+f.w&&p.y+34>f.y&&p.y<f.y+f.h){
    if(p.vy>90){f.alive=0;p.vy=-330;coin+=5;Arcade.beep(900,.08);}
    else{hurt();} } }
  for(const q of coins)if(!q.got&&Math.abs(q.x-p.x-10)<22&&Math.abs(q.y-p.y-16)<24){q.got=1;coin++;Arcade.beep(1100,.05);}
  if(p.y>460)hurt();
  if(Math.abs(p.x-goal.x)<30&&Math.abs(p.y-goal.y)<80){lvl++;Arcade.beep(1300,.35);build();}
  cam=Math.max(0,Math.min(2200,p.x-260));
 }
 X.fillStyle='#101a2e';X.fillRect(0,0,720,420);
 for(let i=0;i<14;i++){X.fillStyle='#16223a';const bx=((i*230-cam*.35)%2600+2600)%2600-200;
  X.fillRect(bx,120+(i%4)*30,120,300);}
 X.fillStyle='#2b3450';
 for(const pl of plats){X.fillRect(pl.x-cam,pl.y,pl.w,pl.h);
  X.fillStyle='#3fbf85';X.fillRect(pl.x-cam,pl.y,pl.w,6);X.fillStyle='#2b3450';}
 for(const q of coins)if(!q.got){X.fillStyle='#ffd166';X.beginPath();X.arc(q.x-cam,q.y,9,0,7);X.fill();}
 for(const f of foes)if(f.alive){X.fillStyle='#ff6b6b';X.fillRect(f.x-cam,f.y,f.w,f.h);
  X.fillStyle='#fff';X.fillRect(f.x-cam+4,f.y+6,6,6);X.fillRect(f.x-cam+16,f.y+6,6,6);}
 X.fillStyle='#94a0bd';X.fillRect(goal.x-cam,goal.y-10,4,90);
 X.fillStyle='#5ee0a0';X.beginPath();X.moveTo(goal.x-cam+4,goal.y-10);X.lineTo(goal.x-cam+42,goal.y+4);X.lineTo(goal.x-cam+4,goal.y+18);X.fill();
 X.fillStyle='#7aa2ff';X.fillRect(p.x-cam,p.y,22,34);
 X.fillStyle='#e8cdb0';X.beginPath();X.arc(p.x-cam+11,p.y-4,10,0,7);X.fill();
 if(dead){X.fillStyle='rgba(0,0,0,.75)';X.fillRect(0,0,720,420);X.fillStyle='#ff6b6b';X.font='bold 28px monospace';X.textAlign='center';
  X.fillText('GAME OVER',360,200);X.font='13px monospace';X.fillStyle='#94a0bd';X.fillText('ESPACIO para reiniciar',360,230);X.textAlign='left';}
 document.getElementById('co').textContent=coin;document.getElementById('v').textContent=lives;});
function hurt(){lives--;Arcade.beep(150,.3);
 if(lives<=0){dead=1;}else{p.x=60;p.y=300;p.vx=p.vy=0;}}
init();</script></body></html>
