<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>🐦 Flappy</title><link rel="stylesheet" href="../assets/arcade.css"></head>
<body><header class="bar"><button class="back" onclick="location.href='../index.html'">&larr; Arcade</button><h1>🐦 Flappy</h1></header><main>
<div class="hud"><span>Puntos <b id="s">0</b></span><span>Récord <b id="b">0</b></span></div>
<canvas id="c" width="420" height="560"></canvas>
<div class="row"><button class="btn" onclick="init()">Reiniciar</button></div>
<p class="help">ESPACIO, clic o toca para aletear. Pasa entre los tubos.</p></main>
<script src="../assets/arcade.js"></script><script>
const c=document.getElementById('c'),x=c.getContext('2d');
let y,vy,pipes,score,dead,t;
function init(){y=250;vy=0;pipes=[];score=0;dead=0;t=0;}
function flap(){ if(dead){init();return;} vy=-330;Arcade.beep(700,.05);}
addEventListener('keydown',e=>{if(e.code==='Space'){flap();e.preventDefault();}});
c.onmousedown=flap;c.ontouchstart=e=>{flap();e.preventDefault();};
Arcade.loop(dt=>{
 if(!dead){ t+=dt; vy+=980*dt; y+=vy*dt;
  if(t>1.3){t=0;const h=80+Math.random()*260;pipes.push({x:420,h,g:150+Math.max(0,60-score*2),sc:0});}
  for(const p of pipes){p.x-=170*dt;
   if(!p.sc&&p.x+60<100){p.sc=1;score++;Arcade.beep(900,.06);}
   if(100+16>p.x&&100-16<p.x+60&&(y-16<p.h||y+16>p.h+p.g)){dead=1;Arcade.beep(110,.3);}}
  pipes=pipes.filter(p=>p.x>-70);
  if(y>544||y<0){dead=1;} }
 const sky=x.createLinearGradient(0,0,0,560);sky.addColorStop(0,'#1b2740');sky.addColorStop(1,'#0b0d14');
 x.fillStyle=sky;x.fillRect(0,0,420,560);
 for(const p of pipes){x.fillStyle='#3fbf85';x.fillRect(p.x,0,60,p.h);x.fillRect(p.x,p.h+p.g,60,560);
  x.fillStyle='#2f9668';x.fillRect(p.x-4,p.h-18,68,18);x.fillRect(p.x-4,p.h+p.g,68,18);}
 x.fillStyle='#141a28';x.fillRect(0,544,420,16);
 x.save();x.translate(100,y);x.rotate(Math.max(-.5,Math.min(1,vy/500)));
 x.fillStyle='#e8d24a';x.beginPath();x.arc(0,0,16,0,7);x.fill();
 x.fillStyle='#fff';x.beginPath();x.arc(6,-5,5,0,7);x.fill();
 x.fillStyle='#111';x.beginPath();x.arc(8,-5,2.5,0,7);x.fill();
 x.fillStyle='#e89a4a';x.beginPath();x.moveTo(14,2);x.lineTo(26,6);x.lineTo(14,10);x.fill();x.restore();
 x.fillStyle='#fff';x.font='bold 34px monospace';x.textAlign='center';x.fillText(score,210,60);
 if(dead){x.fillStyle='rgba(0,0,0,.7)';x.fillRect(0,0,420,560);x.fillStyle='#ff6b6b';x.font='bold 26px monospace';
  x.fillText('GAME OVER',210,270);x.fillStyle='#94a0bd';x.font='13px monospace';x.fillText('Toca o ESPACIO para reiniciar',210,300);}
 x.textAlign='left';
 s.textContent=score;b.textContent=Arcade.best('flappy',score);});
init();</script></body></html>
