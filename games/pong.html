<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>🏓 Pong</title><link rel="stylesheet" href="../assets/arcade.css"></head>
<body><header class="bar"><button class="back" onclick="location.href='../index.html'">&larr; Arcade</button><h1>🏓 Pong</h1></header><main>
<div class="hud"><span>Tú <b id="p1">0</b></span><span>CPU <b id="p2">0</b></span><span>Dificultad <b id="d">Normal</b></span></div>
<canvas id="c" width="700" height="420"></canvas>
<div class="row"><button class="btn" onclick="init()">Reiniciar</button><button class="btn" onclick="diff()">Dificultad</button></div>
<p class="help">↑/↓ o el ratón. Primero a 7 puntos gana.</p></main>
<script src="../assets/arcade.js"></script><script>
const c=document.getElementById('c'),x=c.getContext('2d');
let a,b,ball,s1,s2,k={},lvl=1,names=['Fácil','Normal','Difícil'];
function init(){a=180;b=180;s1=s2=0;serve(1);}
function serve(d){ball={x:350,y:210,vx:300*d,vy:(Math.random()*260-130)};}
addEventListener('keydown',e=>{k[e.key]=1;if(e.key===' ')init();});
addEventListener('keyup',e=>k[e.key]=0);
c.addEventListener('mousemove',e=>{const r=c.getBoundingClientRect();a=(e.clientY-r.top)*(c.height/r.height)-40;});
c.addEventListener('touchmove',e=>{const r=c.getBoundingClientRect();a=(e.touches[0].clientY-r.top)*(c.height/r.height)-40;e.preventDefault();});
function diff(){lvl=(lvl+1)%3;}
Arcade.loop(dt=>{
 if(k.ArrowUp)a-=420*dt; if(k.ArrowDown)a+=420*dt;
 a=Math.max(0,Math.min(340,a));
 const sp=[190,300,430][lvl];
 const tgt=ball.vx>0?ball.y-40:210-40;
 b+=Math.max(-sp*dt,Math.min(sp*dt,tgt-b));b=Math.max(0,Math.min(340,b));
 ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;
 if(ball.y<6||ball.y>414){ball.vy*=-1;Arcade.beep(300,.04);}
 if(ball.x<30&&ball.x>18&&ball.y>a&&ball.y<a+80){ball.vx=Math.abs(ball.vx)*1.06;ball.vy+=((ball.y-a)/80-.5)*300;Arcade.beep(600,.05);}
 if(ball.x>670&&ball.x<682&&ball.y>b&&ball.y<b+80){ball.vx=-Math.abs(ball.vx)*1.06;ball.vy+=((ball.y-b)/80-.5)*300;Arcade.beep(500,.05);}
 if(ball.x<0){s2++;Arcade.beep(120,.2);serve(1);} if(ball.x>700){s1++;Arcade.beep(900,.2);serve(-1);}
 x.fillStyle='#0b0d14';x.fillRect(0,0,700,420);
 x.strokeStyle='#26304a';x.setLineDash([10,14]);x.beginPath();x.moveTo(350,0);x.lineTo(350,420);x.stroke();x.setLineDash([]);
 x.fillStyle='#5ee0a0';x.fillRect(18,a,10,80);
 x.fillStyle='#7aa2ff';x.fillRect(672,b,10,80);
 x.fillStyle='#fff';x.fillRect(ball.x-6,ball.y-6,12,12);
 if(s1>=7||s2>=7){x.fillStyle='#ffd166';x.font='bold 26px monospace';x.textAlign='center';
  x.fillText(s1>=7?'¡GANAS!':'GANA LA CPU',350,200);x.font='13px monospace';x.fillText('ESPACIO para reiniciar',350,230);x.textAlign='left';ball.vx=ball.vy=0;}
 p1.textContent=s1;p2.textContent=s2;d.textContent=names[lvl];});
init();</script></body></html>
