<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>🏰 Tower Defense</title><link rel="stylesheet" href="../assets/arcade.css"></head>
<body><header class="bar"><button class="back" onclick="location.href='../index.html'">&larr; Arcade</button><h1>🏰 Tower Defense</h1></header><main>
<div class="hud"><span>Oro <b id="g">120</b></span><span>Vidas <b id="v">20</b></span><span>Oleada <b id="w">0</b></span><span id="st"></span></div>
<canvas id="c" width="640" height="480"></canvas>
<div class="row">
 <button class="btn" id="t1" onclick="sel='gun'">🔫 Torreta (50)</button>
 <button class="btn" id="t2" onclick="sel='ice'">❄ Hielo (75)</button>
 <button class="btn" id="t3" onclick="sel='cannon'">💣 Cañón (110)</button>
 <button class="btn" onclick="nextWave()">▶ Siguiente oleada</button>
 <button class="btn" onclick="init()">Reiniciar</button></div>
<p class="help">Coloca torres junto al camino (clic). Cada oleada da oro. ¡No dejes pasar 20 enemigos!</p></main>
<script src="../assets/arcade.js"></script><script>
const c=document.getElementById('c'),x=c.getContext('2d');
const PATH=[[0,80],[520,80],[520,200],[120,200],[120,330],[560,330],[560,430],[640,430]];
let towers,ens,gold,lives,wave,sel='gun',spawnQ,spawnT,shots;
const COST={gun:50,ice:75,cannon:110};
function init(){towers=[];ens=[];gold=120;lives=20;wave=0;spawnQ=0;spawnT=0;shots=[];upd();}
function upd(){document.getElementById('g').textContent=gold;document.getElementById('v').textContent=lives;
 document.getElementById('w').textContent=wave;}
function onPath(px,py){
 for(let i=0;i<PATH.length-1;i++){const [x1,y1]=PATH[i],[x2,y2]=PATH[i+1];
  const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy);
  const t=Math.max(0,Math.min(1,((px-x1)*dx+(py-y1)*dy)/(L*L)));
  if(Math.hypot(px-(x1+dx*t),py-(y1+dy*t))<30)return true;}
 return false;}
c.onclick=e=>{const r=c.getBoundingClientRect();
 const px=(e.clientX-r.left)*(640/r.width),py=(e.clientY-r.top)*(480/r.height);
 if(onPath(px,py)){document.getElementById('st').textContent='❌ No puedes construir en el camino';return;}
 if(towers.some(t=>Math.hypot(t.x-px,t.y-py)<34)){document.getElementById('st').textContent='❌ Muy cerca de otra torre';return;}
 if(gold<COST[sel]){document.getElementById('st').textContent='❌ Sin oro suficiente';return;}
 gold-=COST[sel];towers.push({x:px,y:py,t:sel,cd:0,lvl:1});Arcade.beep(600,.07);
 document.getElementById('st').textContent='';upd();};
function nextWave(){ if(spawnQ>0)return; wave++;
 spawnQ=6+wave*2; gold+=25+wave*4; Arcade.beep(500,.2);upd();}
function mkEnemy(){const hp=18+wave*13, boss=wave%5===0&&spawnQ===1;
 return {d:0,hp:boss?hp*7:hp,max:boss?hp*7:hp,sp:(34+wave*1.6)*(boss?.6:1),slow:0,boss,r:boss?18:11};}
function posOn(d){let rem=d;
 for(let i=0;i<PATH.length-1;i++){const [x1,y1]=PATH[i],[x2,y2]=PATH[i+1];
  const L=Math.hypot(x2-x1,y2-y1);
  if(rem<=L)return {x:x1+(x2-x1)*rem/L,y:y1+(y2-y1)*rem/L};
  rem-=L;}
 return null;}
Arcade.loop(dt=>{
 if(spawnQ>0){spawnT-=dt;if(spawnT<=0){spawnT=.75;ens.push(mkEnemy());spawnQ--;}}
 for(const e of ens){ e.slow=Math.max(0,e.slow-dt);
  e.d+=e.sp*(e.slow>0?.45:1)*dt;
  const p=posOn(e.d); if(!p){e.dead=1;lives--;Arcade.beep(150,.2);upd();}}
 for(const t of towers){ t.cd-=dt;
  if(t.cd>0)continue;
  const rng=t.t==='cannon'?130:t.t==='ice'?100:110;
  let tgt=null,bd=-1;
  for(const e of ens){ if(e.dead)continue; const p=posOn(e.d); if(!p)continue;
   if(Math.hypot(p.x-t.x,p.y-t.y)<rng&&e.d>bd){bd=e.d;tgt=e;} }
  if(tgt){ const p=posOn(tgt.d);
   t.cd=t.t==='gun'?.42:t.t==='ice'?.7:1.15; t.ang=Math.atan2(p.y-t.y,p.x-t.x);
   shots.push({x:t.x,y:t.y,tx:p.x,ty:p.y,life:.12,t:t.t});
   if(t.t==='cannon'){ for(const e of ens){const q=posOn(e.d);
     if(q&&Math.hypot(q.x-p.x,q.y-p.y)<46){e.hp-=26;}} Arcade.beep(180,.08); }
   else if(t.t==='ice'){ tgt.hp-=8; tgt.slow=1.4; Arcade.beep(900,.04); }
   else { tgt.hp-=14; Arcade.beep(700,.03); } } }
 for(const e of ens)if(e.hp<=0&&!e.dead){e.dead=1;gold+=e.boss?60:8+wave;upd();Arcade.beep(400,.05);}
 ens=ens.filter(e=>!e.dead);
 for(const s of shots)s.life-=dt; shots=shots.filter(s=>s.life>0);
 if(lives<=0){document.getElementById('st').textContent='💀 Derrota — pulsa Reiniciar';spawnQ=0;ens=[];}
 // render
 x.fillStyle='#0f1a12';x.fillRect(0,0,640,480);
 x.strokeStyle='#3b3222';x.lineWidth=44;x.lineJoin='round';x.beginPath();
 PATH.forEach((p,i)=>i?x.lineTo(...p):x.moveTo(...p));x.stroke();
 x.strokeStyle='#544733';x.lineWidth=36;x.beginPath();
 PATH.forEach((p,i)=>i?x.lineTo(...p):x.moveTo(...p));x.stroke();
 for(const t of towers){
  x.fillStyle=t.t==='gun'?'#7aa2ff':t.t==='ice'?'#4fd6e0':'#e89a4a';
  x.beginPath();x.arc(t.x,t.y,15,0,7);x.fill();
  x.strokeStyle='#0b0d14';x.lineWidth=5;x.beginPath();x.moveTo(t.x,t.y);
  x.lineTo(t.x+Math.cos(t.ang||0)*18,t.y+Math.sin(t.ang||0)*18);x.stroke();}
 for(const e of ens){const p=posOn(e.d); if(!p)continue;
  x.fillStyle=e.boss?'#b06bd6':(e.slow>0?'#7fd8e8':'#ff6b6b');
  x.beginPath();x.arc(p.x,p.y,e.r,0,7);x.fill();
  x.fillStyle='#0b0d14';x.fillRect(p.x-14,p.y-e.r-9,28,5);
  x.fillStyle='#5ee0a0';x.fillRect(p.x-13,p.y-e.r-8,26*Math.max(0,e.hp)/e.max,3);}
 x.lineWidth=2;
 for(const s of shots){x.strokeStyle=s.t==='ice'?'#4fd6e0':s.t==='cannon'?'#e89a4a':'#ffe23d';
  x.beginPath();x.moveTo(s.x,s.y);x.lineTo(s.tx,s.ty);x.stroke();}
 x.fillStyle='#94a0bd';x.font='12px monospace';
 x.fillText('Seleccionado: '+(sel==='gun'?'Torreta':sel==='ice'?'Hielo':'Cañón'),10,470);});
init();</script></body></html>
