<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>➗ Cálculo rápido</title><link rel="stylesheet" href="../assets/arcade.css"></head>
<body><header class="bar"><button class="back" onclick="location.href='../index.html'">&larr; Arcade</button><h1>➗ Cálculo rápido</h1></header><main>
<style>#q{font-size:clamp(30px,10vw,56px);margin:16px 0}
#ans{font-size:28px;width:180px;text-align:center;padding:8px;border-radius:10px;border:1px solid var(--line);background:#141a28;color:var(--txt);font-family:var(--font)}</style>
<div class="hud"><span>Puntos <b id="s">0</b></span><span>Racha <b id="r">0</b></span><span>Tiempo <b id="t">60</b></span><span>Récord <b id="b">0</b></span></div>
<div id="q">—</div><input id="ans" inputmode="numeric" autocomplete="off">
<div class="row"><button class="btn" onclick="start(1)">Fácil</button><button class="btn" onclick="start(2)">Medio</button><button class="btn" onclick="start(3)">Difícil</button></div>
<p class="help">Responde con el teclado y pulsa Enter. 60 segundos, ¡todas las que puedas!</p></main>
<script src="../assets/arcade.js"></script><script>
let a,b,op,res,score,streak,time,run,iv,diff=1;
function start(d){diff=d;score=0;streak=0;time=60;run=1;next();
 clearInterval(iv);iv=setInterval(()=>{time--;document.getElementById('t').textContent=time;
  if(time<=0){run=0;clearInterval(iv);document.getElementById('b').textContent=Arcade.best('math',score);
   alert('¡Tiempo! Puntos: '+score);}},1000);
 document.getElementById('ans').focus();}
function next(){const R=n=>1+Math.random()*n|0;
 const ops=diff===1?['+','-']:diff===2?['+','-','×']:['+','-','×','÷'];
 op=ops[Math.random()*ops.length|0];
 const m=diff===1?12:diff===2?20:30;
 a=R(m);b=R(m);
 if(op==='-'&&b>a)[a,b]=[b,a];
 if(op==='×'){a=R(diff===3?15:10);b=R(diff===3?15:10);}
 if(op==='÷'){b=R(9);res=R(12);a=b*res;}
 res=op==='+'?a+b:op==='-'?a-b:op==='×'?a*b:a/b;
 document.getElementById('q').textContent=a+' '+op+' '+b+' =';}
document.getElementById('ans').addEventListener('keydown',e=>{ if(e.key!=='Enter'||!run)return;
 const v=+e.target.value;e.target.value='';
 if(v===res){streak++;score+=10+streak*2;Arcade.beep(900,.06);}
 else{streak=0;score=Math.max(0,score-5);Arcade.beep(180,.15);}
 document.getElementById('s').textContent=score;document.getElementById('r').textContent=streak;next();});
document.getElementById('b').textContent=Arcade.best('math',0);
</script></body></html>
